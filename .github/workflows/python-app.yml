async def moderate_group(update: Update, context: ContextTypes.DEFAULT_TYPE):
    message = update.message
    if not message or not message.text:
        return
    if message.chat.type in ["group", "supergroup"]:
        text = message.text.lower()
        if "http://" in text or "https://" in text or "t.me/" in text or "@" in text:
            try:
                await message.delete()
            except Exception as e:
                print(f"Error: {e}")

async def auto_receive_media(update: Update, context: ContextTypes.DEFAULT_TYPE):
    message = update.message
    if not message:
        return

    caption = (message.caption or message.text or "").lower()
    file_id = None
    media_type = "video"

    # ভিডিও বা ছবি যেকোনো একটি পেলেই সেটি শনাক্ত করবে
    if message.video:
        file_id = message.video.file_id
        media_type = "video"
    elif message.photo:
        file_id = message.photo[-1].file_id  # সবচেয়ে হাই কোয়ালিটির ছবি নিবে
        media_type = "photo"

    if file_id:
        if "#cid" in caption:
            if file_id not in DATABASE["cid"]:
                DATABASE["cid"].append(file_id)
            await message.reply_text("✅ সিআইডি (CID) মিডিয়া সফলভাবে সেভ হয়েছে!")
        elif "#hot" in caption:
            if file_id not in DATABASE["hot"]:
                DATABASE["hot"].append(file_id)
            await message.reply_text("✅ হট মিডিয়া সফলভাবে সেভ হয়েছে!")
        elif "#natok" in caption:
            if file_id not in DATABASE["natok"]:
                DATABASE["natok"].append(file_id)
            await message.reply_text("✅ নাটক মিডিয়া সফলভাবে সেভ হয়েছে!")
        elif "#bangla" in caption:
            if file_id not in DATABASE["bangla"]:
                DATABASE["bangla"].append(file_id)
            await message.reply_text("✅ বাংলা মিডিয়া সফলভাবে সেভ হয়েছে!")
        elif "#hindi" in caption:
            if file_id not in DATABASE["hindi"]:
                DATABASE["hindi"].append(file_id)
            await message.reply_text("✅ হিন্দি মিডিয়া সফলভাবে সেভ হয়েছে!")

async def check_subscription(user_id, context):
    try:
        member = await context.bot.get_chat_member(chat_id=REQUIRED_CHANNEL, user_id=user_id)
        if member.status in ["member", "administrator", "creator"]:
            return True
    except:
        pass
    return False

